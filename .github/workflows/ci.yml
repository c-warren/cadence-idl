name: CI

on: pull_request

jobs:
  proto-lint:
    name: proto lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Regenerate Proto code
        run: make proto-go

      - name: Debug raw generator output
        run: |
          set -x
          go version
          go version -m .bin/protoc-gen-gogofast | head -8
          find ./proto/uber/cadence/admin/v1/ ./proto/uber/cadence/api/v1/ -name '*.proto'
          grep -n -B2 -A4 "assigned to DescribeBy" go/proto/api/v1/service_domain.pb.go | cat -A
          GOGO="$(go env GOMODCACHE)/github.com/gogo/protobuf@v1.3.2"
          cp -r "$GOGO" /tmp/gogo && chmod -R u+w /tmp/gogo
          sed -i 's|^\toriginal := g.Bytes()$|\toriginal := g.Bytes()\n\t_ = os.WriteFile("/tmp/raw-"+strings.ReplaceAll(*g.file.Name, "/", "_")+".txt", original, 0644)|' /tmp/gogo/protoc-gen-gogo/generator/generator.go
          grep -n "raw-" /tmp/gogo/protoc-gen-gogo/generator/generator.go
          go mod edit -replace github.com/gogo/protobuf=/tmp/gogo
          rm -f .bin/protoc-gen-gogofast
          GOFLAGS=-mod=mod make proto-go
          ls -la /tmp/raw-*
          echo "=== RAW service_domain DescribeBy"
          grep -n -B3 -A4 "assigned to DescribeBy" /tmp/raw-uber_cadence_api_v1_service_domain.proto.txt | cat -A
          echo "=== RAW history HistoryEvent Attributes (control)"
          grep -n -B3 -A3 "assigned to Attributes" /tmp/raw-uber_cadence_api_v1_history.proto.txt | head -8 | cat -A
          echo "=== REGENERATED service_domain DescribeBy (patched plugin)"
          grep -n -B2 -A4 "assigned to DescribeBy" go/proto/api/v1/service_domain.pb.go | cat -A

      - name: Proto lint
        run: make proto-lint

      - name: Ensure generated code is checked in
        run: |
          echo "Checking for uncommitted generated changes..."
          NUM_FILES_CHANGED=$(git status --porcelain 2>&1 | wc -l)
          echo "NUM_FILES_CHANGED: ${NUM_FILES_CHANGED}"
          if [ "${NUM_FILES_CHANGED}" -ne 0 ]; then
              printf "Please run this command and commit the changes:\n"
              printf "\tmake proto-go && make proto-lint\n"
              git status --porcelain
              git --no-pager diff
              exit 1
          fi

  thrift-can-compile:
    name: thrift compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install thrift compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y thrift-compiler

      - name: Thrift lint
        run: make thriftlint
